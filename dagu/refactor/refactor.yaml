name: refactor
shell: ["bash", "-e", "-u", "-o", "pipefail"]
params:
  - REPO_DIR: "."
  - SCRIPTS_DIR: "/Users/vk/@iw2rmb/auto/dagu/refactor/scripts"
  - CLAUDE_MODEL: "sonnet"
  - CLAUDE_REFACTOR_REASONING: "high"
  - CODEX_MODEL: "gpt-5.4"
  - CODEX_REVIEW_REASONING: "high"
  - TARGET_FILTER: ""

steps:
  - name: refactor-all-paths
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/refactor-loop.sh" \
        --repo "${REPO_DIR}" \
        --scripts-dir "${scripts_dir}" \
        --claude-model "${CLAUDE_MODEL}" \
        --claude-reasoning "${CLAUDE_REFACTOR_REASONING}" \
        --codex-model "${CODEX_MODEL}" \
        --codex-reasoning "${CODEX_REVIEW_REASONING}" \
        --target-filter "${TARGET_FILTER}"
