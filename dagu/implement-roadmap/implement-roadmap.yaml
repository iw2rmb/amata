name: implement-roadmap
working_dir: ${REPO_DIR}
shell: ["bash", "-e", "-u", "-o", "pipefail"]
params:
  - REPO_DIR: "."
  - ROADMAP_FILE: "roadmap/index.md"
  - STATE_DIR: ".amata"
  - SCRIPTS_DIR: "~/@iw2rmb/auto/dagu/implement-roadmap/scripts"
  - CODEX_MODEL: "gpt-5.4"
  - CODEX_CORRECTNESS_REASONING: "xhigh"
  - CODEX_DOCS_REASONING: "high"
  - CLAUDE_MODEL: "sonnet"
  - CLAUDE_REFACTOR_REASONING: "high"

steps:
  - name: implement-all-open-items
    command: >
      rtk bash "${SCRIPTS_DIR}/implement-open-items-loop.sh"
      --repo "${REPO_DIR}"
      --doc "${ROADMAP_FILE}"
      --scripts-dir "${SCRIPTS_DIR}"
      --model "${CODEX_MODEL}"
      --state-dir "${STATE_DIR}"

  - name: correct
    command: >
      rtk bash "${SCRIPTS_DIR}/correct-phase.sh"
      --repo "${REPO_DIR}"
      --roadmap-file "${ROADMAP_FILE}"
      --scripts-dir "${SCRIPTS_DIR}"
      --model "${CODEX_MODEL}"
      --reasoning "${CODEX_CORRECTNESS_REASONING}"
      --state-dir "${STATE_DIR}"

  - name: refactor
    command: >
      rtk bash "${SCRIPTS_DIR}/refactor-phase.sh"
      --repo "${REPO_DIR}"
      --roadmap-file "${ROADMAP_FILE}"
      --scripts-dir "${SCRIPTS_DIR}"
      --model "${CLAUDE_MODEL}"
      --reasoning "${CLAUDE_REFACTOR_REASONING}"

  - name: sanity
    command: >
      rtk bash "${SCRIPTS_DIR}/sanity-phase.sh"
      --repo "${REPO_DIR}"
      --roadmap-file "${ROADMAP_FILE}"
      --scripts-dir "${SCRIPTS_DIR}"
      --model "${CODEX_MODEL}"
      --reasoning "${CODEX_CORRECTNESS_REASONING}"
      --state-dir "${STATE_DIR}"

  - name: update-docs
    command: >
      rtk bash "${SCRIPTS_DIR}/update-docs-phase.sh"
      --repo "${REPO_DIR}"
      --roadmap-file "${ROADMAP_FILE}"
      --scripts-dir "${SCRIPTS_DIR}"
      --model "${CODEX_MODEL}"
      --reasoning "${CODEX_DOCS_REASONING}"
      --state-dir "${STATE_DIR}"
