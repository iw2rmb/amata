name: implement-roadmap
working_dir: ${REPO_DIR}
shell: ["bash", "-e", "-u", "-o", "pipefail"]
params:
  - REPO_DIR: "."
  - ROADMAP_FILE: "roadmap/index.md"
  - STATE_DIR: ".amata"
  - SCRIPTS_DIR: "/Users/vk/@iw2rmb/amata/dagu/implement-roadmap/scripts"
  - CODEX_MODEL: "gpt-5.4"
  - CODEX_CORRECTNESS_REASONING: "xhigh"
  - CODEX_DOCS_REASONING: "high"
  - CLAUDE_MODEL: "sonnet"
  - CLAUDE_REFACTOR_REASONING: "high"

steps:
  - name: implement-all-open-items
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/implement-open-items-loop.sh" \
        --repo "${REPO_DIR}" \
        --doc "${ROADMAP_FILE}" \
        --scripts-dir "${scripts_dir}" \
        --model "${CODEX_MODEL}" \
        --state-dir "${STATE_DIR}"

  - name: correct
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/correct-phase.sh" \
        --repo "${REPO_DIR}" \
        --roadmap-file "${ROADMAP_FILE}" \
        --scripts-dir "${scripts_dir}" \
        --model "${CODEX_MODEL}" \
        --reasoning "${CODEX_CORRECTNESS_REASONING}" \
        --state-dir "${STATE_DIR}"

  - name: refactor
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/refactor-phase.sh" \
        --repo "${REPO_DIR}" \
        --roadmap-file "${ROADMAP_FILE}" \
        --scripts-dir "${scripts_dir}" \
        --model "${CLAUDE_MODEL}" \
        --reasoning "${CLAUDE_REFACTOR_REASONING}"

  - name: sanity
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/sanity-phase.sh" \
        --repo "${REPO_DIR}" \
        --roadmap-file "${ROADMAP_FILE}" \
        --scripts-dir "${scripts_dir}" \
        --model "${CODEX_MODEL}" \
        --reasoning "${CODEX_CORRECTNESS_REASONING}" \
        --state-dir "${STATE_DIR}"

  - name: update-docs
    command: |
      scripts_dir="${SCRIPTS_DIR/#\~/$HOME}"
      bash "${scripts_dir}/update-docs-phase.sh" \
        --repo "${REPO_DIR}" \
        --roadmap-file "${ROADMAP_FILE}" \
        --scripts-dir "${scripts_dir}" \
        --model "${CODEX_MODEL}" \
        --reasoning "${CODEX_DOCS_REASONING}" \
        --state-dir "${STATE_DIR}"
