version: amata/v1
name: implement-roadmap
entry: main

workspace:
  root: "design/engine/example/fixture-repo"
  state_dir: ".amata"

params:
  roadmap_file: "roadmap/index.md"
  codex_model: "gpt-5.4"
  codex_correctness_reasoning: "xhigh"
  codex_docs_reasoning: "high"
  claude_model: "sonnet"
  claude_refactor_reasoning: "high"

defaults:
  cwd: $.workspace.root
  expr_lang: starlark
  executors:
    codex:
      model: $.params.codex_model
    claude:
      model: $.params.claude_model
    git.commit:
      exclude_paths:
        - $.workspace.state_dir

schemas:
  implement_result:
    type: object
    required: [hasOpenItem, summary]
    additionalProperties: false
    properties:
      hasOpenItem: {type: boolean}
      summary: {type: string}
      commitMessage: {type: string}
      reviewReasoning: {type: string}
  review_result:
    type: object
    required: [approved, notes]
    additionalProperties: false
    properties:
      approved: {type: boolean}
      notes: {type: string}
  review_commit_result:
    type: object
    required: [approved, notes, commitMessage]
    additionalProperties: false
    properties:
      approved: {type: boolean}
      notes: {type: string}
      commitMessage: {type: string}
  docs_result:
    type: object
    required: [commitMessage]
    additionalProperties: false
    properties:
      commitMessage: {type: string}

flows:
  main:
    steps:
      - type: call
        flow: implement_loop

      - type: codex
        reasoning: $.params.codex_correctness_reasoning
        prompt: |
          Confirm the roadmap work is wired end-to-end.
          Address findings, if any.
          Return approval as a boolean and a short review note.
        response:
          schema:
            $ref: "#/schemas/review_result"
        expect: $.value["approved"]

      - type: claude
        reasoning: $.params.claude_refactor_reasoning
        prompt: |
          Review the implemented roadmap work for material refactors.
          Address findings, if any.
          Return approval as a boolean and a short review note.
        response:
          schema:
            $ref: "#/schemas/review_result"
        expect: $.value["approved"]

      - type: codex
        reasoning: $.params.codex_correctness_reasoning
        prompt: |
          Review the current uncommitted diff after correctness and refactor.
          Address findings, if any.
          Return approval as a boolean, a short review note, and a commit message for any follow-up changes.
        response:
          schema:
            $ref: "#/schemas/review_commit_result"
        expect: $.value["approved"]

      - type: git.commit
        message: $.prev.value["commitMessage"]

      - type: codex
        reasoning: $.params.codex_docs_reasoning
        prompt: |
          Update documentation for the completed roadmap work.
          Return the commit message for the docs cleanup.
        response:
          schema:
            $ref: "#/schemas/docs_result"

      - type: git.commit
        message: $.prev.value["commitMessage"]

  implement_loop:
    steps:
      - type: codex
        prompt: |
          Implement next open item from the {{ ctx.params.roadmap_file }}.
        response:
          schema:
            $ref: "#/schemas/implement_result"

      - type: switch
        cases:
          - when:
              expr: not ctx.prev.value["hasOpenItem"]
            steps:
              - expr: $.prev.value

          - when:
              expr: ctx.prev.value["hasOpenItem"]
            steps:
              - type: codex
                reasoning: $.prev.value["reviewReasoning"]
                prompt: |
                  Review the current uncommitted diff for the selected roadmap item.
                  Address findings, if any.
                  Return approval as a boolean, a short review note, and the commit message to use.
                response:
                  schema:
                    $ref: "#/schemas/review_commit_result"
                expect: $.value["approved"]

              - type: git.commit
                message: $.prev.value["commitMessage"]

              - type: call
                flow: implement_loop
