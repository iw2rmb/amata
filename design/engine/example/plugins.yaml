version: amata/plugins/v1

plugins:
  roadmap.items:
    exec:
      - python3
      - scripts/roadmap_items.py
    config_schema:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          format: path
  roadmap.mark_done:
    exec:
      - python3
      - scripts/roadmap_mark_done.py
    config_schema:
      type: object
      required: [file, match]
      additionalProperties: false
      properties:
        file:
          type: string
          format: path
        match:
          type: object
          additionalProperties: false
          anyOf:
            - required: [label]
            - required: [title]
          properties:
            label: {type: string}
            title: {type: string}
  git.commit:
    exec:
      - python3
      - scripts/git_commit.py
    config_schema:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
        exclude_paths:
          type: array
          items:
            type: string
            format: path
