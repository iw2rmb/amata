version: amata/plugins/v1

plugins:
  git.commit:
    exec:
      - python3
      - scripts/git_commit.py
    config_schema:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
        exclude_paths:
          type: array
          items:
            type: string
            format: path
